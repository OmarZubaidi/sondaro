[project]
name = "sondaro"
version = "1.0.0"
description = "Concert tracking for a Lidarr/Navidrome library, with a trip planner"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "httpx==0.28.1",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

# `web/` is the React app, not a python package — say so explicitly or
# setuptools refuses to guess between the two top-level directories
[tool.setuptools]
packages = ["api", "api.providers", "scripts"]

[project.optional-dependencies]
# runtime deps are pinned; dev tooling is ranged so a new interpreter doesn't
# strand the suite on a version that predates it
dev = [
    "pytest>=8.4",
    "pytest-asyncio>=1.2",
    "pytest-bdd>=8.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
bdd_features_base_dir = "tests/features"
filterwarnings = [
    # our own deprecations are errors
    "error::DeprecationWarning",
    # starlette's TestClient calls asyncio.iscoroutinefunction, deprecated in
    # 3.14. Not ours to fix, and scoped to that one message so everything else
    # still fails loudly.
    "ignore:'asyncio.iscoroutinefunction' is deprecated:DeprecationWarning",
    # same deal: anyio 4.15 deprecated the anyio.abc.BlockingPortal alias that
    # starlette 0.41.3 (pinned by fastapi 0.115.6) still imports.
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]
