<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#0b0b0f" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#000000" />
    <meta name="color-scheme" content="light dark" />
    <!-- inline so the theme is set before the first paint; ThemeToggle takes over after -->
    <script>
      {
        let theme = null
        try {
          theme = localStorage.getItem('theme')
        } catch {}
        document.documentElement.dataset.theme =
          theme ?? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
      }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;700;800&family=DM+Mono:wght@400;500&display=swap"
    />
    <title>Sondaro</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
